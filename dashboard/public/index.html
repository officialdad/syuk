<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cone Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header>
    <h1>Smart Cone Dashboard</h1>
    <div class="connection-status">
      <span id="connection-dot" class="dot connecting"></span>
      <span id="connection-text">Connecting...</span>
    </div>
  </header>

  <main>
    <section class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total Cones</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-online">0</span>
        <span class="stat-label">Online</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-alerts">0</span>
        <span class="stat-label">Alerts Today</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-last-incident">--</span>
        <span class="stat-label">Last Incident</span>
      </div>
    </section>

    <section class="cone-status-card" id="cone-status-card">
      <h2>Cone Status</h2>
      <div class="status-body">
        <div class="state-display">
          <span class="label">State</span>
          <span id="cone-state" class="state upright">UPRIGHT</span>
        </div>
        <div class="status-details">
          <div class="detail">
            <span class="label">Cone ID</span>
            <span id="cone-id">--</span>
          </div>
          <div class="detail">
            <span class="label">Last Update</span>
            <span id="last-update">--</span>
          </div>
          <div class="detail">
            <span class="label">Device</span>
            <span id="device-status" class="offline">Offline</span>
          </div>
        </div>
      </div>
    </section>

    <section class="map-container">
      <div class="map-header">
        <h2>Fleet Map</h2>
        <div class="map-controls">
          <button id="btn-setup-mode" class="btn btn-outline">Setup Mode</button>
          <button id="btn-simulator" class="btn btn-outline">Start Simulator</button>
        </div>
      </div>
      <div id="map"></div>
      <div id="setup-panel" class="setup-panel hidden">
        <h3>Place Cone</h3>
        <div class="setup-form">
          <input type="text" id="new-cone-id" placeholder="Cone ID (e.g. cone-002)" />
          <input type="text" id="new-cone-label" placeholder="Label (e.g. Zone A - Entry)" />
          <button id="btn-place-cone" class="btn btn-primary">Use My GPS Location</button>
          <p id="gps-status" class="gps-status"></p>
        </div>
      </div>
    </section>

    <section class="event-log-card">
      <h2>Event Log</h2>
      <div class="table-wrapper">
        <table id="event-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Event Type</th>
              <th>Accel (g)</th>
              <th>Tilt (deg)</th>
              <th>Cone ID</th>
            </tr>
          </thead>
          <tbody id="event-tbody">
          </tbody>
        </table>
        <p id="no-events" class="empty-msg">No events received yet.</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
